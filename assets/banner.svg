<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#1B2A4A" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#D97757" stop-opacity="0.16"/>
    </linearGradient>
    <g id="page">
      <path d="M-24,-32 L20,-32 L34,-18 L34,30 Q34,36 28,36 L-24,36 Q-30,36 -30,30 L-30,-26 Q-30,-32 -24,-32 Z"
            fill="#FBF8F3" stroke="#1B2A4A" stroke-width="3"/>
      <polygon points="20,-32 34,-18 20,-18" fill="#D97757"/>
    </g>
  </defs>

  <rect width="1200" height="320" fill="#FBF8F3"/>

  <!-- faixa de fluxo -->
  <path d="M -20,210 C 220,140 380,260 600,190 C 820,120 960,240 1220,170 L1220,300
           C 960,370 820,250 600,320 C 380,390 220,270 -20,340 Z" fill="url(#ribbon)"/>

  <!-- linhas de movimento -->
  <path d="M420,120 C 560,75 640,165 800,120" stroke="#D97757" stroke-width="3" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M420,140 C 560,95 640,185 800,140" stroke="#D97757" stroke-width="3" fill="none" opacity="0.22" stroke-linecap="round"/>
  <path d="M800,120 C 900,80 950,175 1080,130" stroke="#1B2A4A" stroke-width="3" fill="none" opacity="0.3" stroke-linecap="round"/>

  <!-- wordmark -->
  <text x="70" y="150" font-family="Verdana, Geneva, sans-serif" font-size="64" font-weight="bold" fill="#1B2A4A">PDFlow</text>
  <text x="72" y="185" font-family="Verdana, Geneva, sans-serif" font-size="19" letter-spacing="2" fill="#D97757">DESBLOQUEIE · JUNTE · DIVIDA</text>

  <!-- doc 1: bloqueado -->
  <g transform="translate(560,230) rotate(-10) scale(1.15)">
    <use href="#page"/>
    <circle cx="0" cy="8" r="7" fill="#1B2A4A"/>
    <rect x="-3" y="8" width="6" height="13" rx="2" fill="#1B2A4A"/>
  </g>

  <!-- doc 2 e 3: juntar (sobrepostos) -->
  <g transform="translate(760,150) rotate(6) scale(1.1)">
    <use href="#page" x="10" y="6" opacity="0.55"/>
    <use href="#page"/>
  </g>

  <!-- doc 4: dividir (linha tracejada) -->
  <g transform="translate(970,235) rotate(9) scale(1.15)">
    <use href="#page"/>
    <line x1="-30" y1="2" x2="34" y2="2" stroke="#D97757" stroke-width="2.5" stroke-dasharray="4 4"/>
  </g>
</svg>
